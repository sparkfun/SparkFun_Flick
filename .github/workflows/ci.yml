# Fast checks on every push and pull request: the ABI only grows, generated
# files are current, and every example builds for one target of each chip.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ABI is append-only (api/abi.lock)
        run: python flick/tools/gen_api.py --check
      - name: Generated API files match api/baseline_api.txt
        run: |
          python flick/tools/gen_api.py
          git diff --exit-code -- flick/sdk/include/baseline_api.h flick/baseline/src/gen flick/docs/API.md
      - name: Python tools compile
        run: python -m py_compile flick.py flick/tools/flick.py flick/tools/gen_api.py flick/tools/make_site.py flick/tools/ci/build_examples.py

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the sketch compilers (flick setup)
        uses: actions/cache@v4
        with:
          path: ~/.flick/tools
          key: sketch-toolchains-esp-14.2.0_20260121-${{ runner.os }}
      - run: pip install -r requirements.txt
      - run: python flick.py setup -t thing_plus_esp32 -t thing_plus_esp32c6
      - name: Build every example (one target per chip)
        run: >
          python flick/tools/ci/build_examples.py
          thing_plus_esp32 thing_plus_esp32s3 pro_micro_esp32c3
          thing_plus_esp32c6 thing_plus_esp32c5 iot_redboard_esp32p4_poe
      - name: Sketch kit
        run: python flick.py package
