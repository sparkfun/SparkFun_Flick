# Fast checks on every push and pull request: the ABI only grows, generated
# files are current, and every example builds for one target of each chip.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ABI is append-only (api/abi.lock)
        run: python tools/gen_api.py --check
      - name: Generated API files match api/baseline_api.txt
        run: |
          python tools/gen_api.py
          git diff --exit-code -- sdk/include/baseline_api.h baseline/src/gen docs/API.md
      - name: Python tools compile
        run: python -m py_compile tools/flick.py tools/gen_api.py tools/make_site.py tools/ci/build_examples.py

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the sketch compilers (flick setup)
        uses: actions/cache@v4
        with:
          path: ~/.flick/tools
          key: sketch-toolchains-esp-14.2.0_20260121-${{ runner.os }}
      - run: pip install -r kit/requirements.txt
      - run: python tools/flick.py setup
      - name: Build every example (one target per chip)
        run: >
          python tools/ci/build_examples.py
          thing_plus_esp32 thing_plus_esp32s3 pro_micro_esp32c3
          thing_plus_esp32c6 thing_plus_esp32c5 iot_redboard_esp32p4_poe
      - name: Sketch kit
        run: python tools/flick.py package
