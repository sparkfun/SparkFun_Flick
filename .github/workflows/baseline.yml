# Build Baseline for every target with ESP-IDF 5.5.5 and Arduino-ESP32 3.3.11
# (tools/ci/build_baseline.sh). Runs when the firmware's sources change, and
# is called by release.yml. Each target's images become an artifact named
# after the target: baseline-<target>.bin (flash at 0x0) and .bsu (OTA).
name: Baseline

on:
  push:
    branches: [main]
    paths:
      - "baseline/**"
      - "chips/**"
      - "targets/**"
      - "idf/**"
      - "api/**"
      - "sdk/include/**"
      - "tools/bsk.py"
      - "tools/ci/build_baseline.sh"
      - ".github/workflows/baseline.yml"
  pull_request:
    paths:
      - "baseline/**"
      - "chips/**"
      - "targets/**"
      - "idf/**"
      - "api/**"
      - "sdk/include/**"
      - "tools/bsk.py"
      - "tools/ci/build_baseline.sh"
      - ".github/workflows/baseline.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "list=$(python3 -c 'import json, pathlib; print(json.dumps(sorted(p.parent.name for p in pathlib.Path("targets").glob("*/target.json"))))')" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Arduino-ESP32 (core and precompiled libraries, ~2 GB)
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.11
      - name: Build Baseline for ${{ matrix.target }}
        run: bash tools/ci/build_baseline.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/baseline-${{ matrix.target }}.bin
            dist/${{ matrix.target }}/baseline-${{ matrix.target }}.bsu
          if-no-files-found: error
