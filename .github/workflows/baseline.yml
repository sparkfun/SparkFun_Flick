# Build Baseline for every target with ESP-IDF 5.5.5 and Arduino-ESP32 3.3.11
# (flick/tools/ci/build_baseline.sh). Runs when the firmware's sources change, and
# is called by release.yml. Each target's images become an artifact named
# after the target: baseline-<target>.bin (flash at 0x0) and .bsu (OTA).
name: Baseline

on:
  push:
    branches: [main]
    paths:
      - "flick/baseline/**"
      - "flick/chips/**"
      - "flick/targets/**"
      - "flick/idf/**"
      - "flick/api/**"
      - "flick/sdk/include/**"
      - "flick/tools/flick.py"
      - "flick/tools/ci/build_baseline.sh"
      - "flick/tools/ci/fetch_arduino_esp32.py"
      - ".github/workflows/baseline.yml"
  pull_request:
    paths:
      - "flick/baseline/**"
      - "flick/chips/**"
      - "flick/targets/**"
      - "flick/idf/**"
      - "flick/api/**"
      - "flick/sdk/include/**"
      - "flick/tools/flick.py"
      - "flick/tools/ci/build_baseline.sh"
      - "flick/tools/ci/fetch_arduino_esp32.py"
      - ".github/workflows/baseline.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          echo "list=$(python3 -c 'import json, pathlib; c=lambda t: json.loads(pathlib.Path("flick/chips", json.loads(t.read_text())["chip"], "chip.json").read_text()).get("ci", True); print(json.dumps(sorted(p.parent.name for p in pathlib.Path("flick/targets").glob("*/target.json") if c(p))))')" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      # A Baseline already built from these exact sources is reused, so a run
      # that changes only the page, the examples or the docs takes minutes, not
      # the full build. The key covers every file the build reads.
      - name: Reuse a Baseline built from the same sources
        id: built
        uses: actions/cache@v6
        with:
          path: flick/dist/${{ matrix.target }}
          key: baseline-${{ matrix.target }}-${{ hashFiles('flick/baseline/**', 'flick/chips/**', format('flick/targets/{0}/**', matrix.target), 'flick/idf/**', 'flick/api/**', 'flick/sdk/include/**', 'flick/tools/flick.py', 'flick/tools/gen_api.py', 'flick/tools/gen_audio.py', 'flick/tools/ci/build_baseline.sh', 'flick/tools/ci/fetch_arduino_esp32.py') }}
      - name: Cache Arduino-ESP32 (the core and this chip's precompiled libraries)
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.11-${{ matrix.target }}
      - name: Build Baseline for ${{ matrix.target }}
        if: steps.built.outputs.cache-hit != 'true'
        run: bash flick/tools/ci/build_baseline.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            flick/dist/${{ matrix.target }}/baseline-${{ matrix.target }}.bin
            flick/dist/${{ matrix.target }}/baseline-${{ matrix.target }}.bsu
          if-no-files-found: error
