# Build Baseline for every target with ESP-IDF 5.5.5 and Arduino-ESP32 3.3.11
# (flick/tools/ci/build_baseline.sh). Runs when the firmware's sources change, and
# is called by release.yml. The result is one artifact, "baselines":
# <target>/baseline-<target>.bin (flash at 0x0) and .bsu (OTA) for every ESP
# target, <target>/baseline-<target>.hex (Teensy Loader) for every Teensy target.
#
# Builds are cached by the files they read (flick/tools/ci/baseline_keys.py):
# one entry per target, and one holding every target. When nothing changed,
# the "bundle" job restores them all and no build runner starts.
name: Baseline

on:
  push:
    branches: [main]
    paths:
      - "flick/baseline/**"
      - "flick/chips/**"
      - "flick/targets/**"
      - "flick/idf/**"
      - "flick/api/**"
      - "flick/sdk/include/**"
      - "flick/tools/flick.py"
      - "flick/tools/ci/build_baseline.sh"
      - "flick/tools/ci/fetch_arduino_esp32.py"
      - "flick/tools/ci/baseline_keys.py"
      - ".github/workflows/baseline.yml"
  pull_request:
    paths:
      - "flick/baseline/**"
      - "flick/chips/**"
      - "flick/targets/**"
      - "flick/idf/**"
      - "flick/api/**"
      - "flick/sdk/include/**"
      - "flick/tools/flick.py"
      - "flick/tools/ci/build_baseline.sh"
      - "flick/tools/ci/fetch_arduino_esp32.py"
      - "flick/tools/ci/baseline_keys.py"
      - ".github/workflows/baseline.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.keys.outputs.list }}
      teensy: ${{ steps.keys.outputs.teensy }}
      keys: ${{ steps.keys.outputs.keys }}
      all: ${{ steps.keys.outputs.all }}
      all_hit: ${{ steps.all.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
      - id: keys
        run: |
          python3 flick/tools/ci/baseline_keys.py > keys.json
          echo "list=$(python3 -c 'import json; print(json.dumps(json.load(open("keys.json"))["esp"]))')" >> "$GITHUB_OUTPUT"
          echo "teensy=$(python3 -c 'import json; print(json.dumps(json.load(open("keys.json"))["teensy"]))')" >> "$GITHUB_OUTPUT"
          echo "keys=$(python3 -c 'import json; print(json.dumps(json.load(open("keys.json"))["keys"]))')" >> "$GITHUB_OUTPUT"
          echo "all=$(python3 -c 'import json; print(json.load(open("keys.json"))["all"])')" >> "$GITHUB_OUTPUT"
      - name: Is every Baseline already built from these sources?
        id: all
        uses: actions/cache/restore@v6
        with:
          path: flick/dist
          key: ${{ steps.keys.outputs.all }}
          lookup-only: true

  build:
    needs: plan
    if: needs.plan.outputs.all_hit != 'true' && needs.plan.outputs.list != '[]'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - name: Reuse a Baseline built from the same sources
        id: built
        uses: actions/cache@v6
        with:
          path: flick/dist/${{ matrix.target }}
          key: ${{ fromJson(needs.plan.outputs.keys)[matrix.target] }}
      - name: Cache Arduino-ESP32 (the core and this chip's precompiled libraries)
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.11-${{ matrix.target }}
      - name: Build Baseline for ${{ matrix.target }}
        if: steps.built.outputs.cache-hit != 'true'
        run: bash flick/tools/ci/build_baseline.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: baseline-${{ matrix.target }}
          path: |
            flick/dist/${{ matrix.target }}/baseline-${{ matrix.target }}.bin
            flick/dist/${{ matrix.target }}/baseline-${{ matrix.target }}.bsu
          if-no-files-found: error

  # Teensy 4.x targets: Teensyduino through arduino-cli (flick baseline build), not ESP-IDF.
  build-teensy:
    needs: plan
    if: needs.plan.outputs.all_hit != 'true' && needs.plan.outputs.teensy != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.teensy) }}
    steps:
      - uses: actions/checkout@v7
      - name: Reuse a Baseline built from the same sources
        id: built
        uses: actions/cache@v6
        with:
          path: flick/dist/${{ matrix.target }}
          key: ${{ fromJson(needs.plan.outputs.keys)[matrix.target] }}
      - name: Cache Teensyduino
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: teensyduino-1.62.0-${{ runner.os }}
      - uses: arduino/setup-arduino-cli@v2
        if: steps.built.outputs.cache-hit != 'true'
      - name: Teensyduino 1.62.0 (chips/imxrt1062/chip.json teensy_core)
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          url=https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli core update-index --additional-urls "$url"
          arduino-cli core install teensy:avr@1.62.0 --additional-urls "$url"
      - name: Build Baseline for ${{ matrix.target }}
        if: steps.built.outputs.cache-hit != 'true'
        run: python3 flick.py baseline build -t ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: baseline-${{ matrix.target }}
          path: flick/dist/${{ matrix.target }}/baseline-${{ matrix.target }}.hex
          if-no-files-found: error

  bundle:
    needs: [plan, build, build-teensy]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.build-teensy.result == 'success' || needs.build-teensy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Every Baseline, from the cache
        if: needs.plan.outputs.all_hit == 'true'
        uses: actions/cache/restore@v6
        with:
          path: flick/dist
          key: ${{ needs.plan.outputs.all }}
          fail-on-cache-miss: true
      - name: Every Baseline, from the build runners
        if: needs.plan.outputs.all_hit != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: baseline-*
          path: flick/dist
      - name: One folder per target
        if: needs.plan.outputs.all_hit != 'true'
        run: for d in flick/dist/baseline-*; do mv "$d" "flick/dist/${d#flick/dist/baseline-}"; done
      - name: Keep them all for the next run
        if: needs.plan.outputs.all_hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: flick/dist
          key: ${{ needs.plan.outputs.all }}
      - uses: actions/upload-artifact@v7
        with:
          name: baselines
          path: flick/dist
          if-no-files-found: error
