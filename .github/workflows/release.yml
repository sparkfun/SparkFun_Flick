# Release: push a tag vX.Y.Z (matching BASELINE_VERSION in flick/baseline/src/bl_main.h).
#   1. Baseline for every target (baseline.yml)
#   2. the sketch kit (flick package)
#   3. every example for every board, for the page's example runner (flick/tools/ci/build_examples.py --out)
#   4. a GitHub release with the images, the .bsu updates and the kit
#   5. the download page with "Flash" buttons and the example runner on GitHub Pages (flick/tools/make_site.py)
# Run it by hand (workflow_dispatch) to rebuild the page without a release.
# Pages: Settings > Pages > Source: "GitHub Actions". While the repository is
# private the page is only built (artifact "download-page"), not deployed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  baseline:
    uses: ./.github/workflows/baseline.yml

  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python flick.py package
          mkdir -p dist/kit && mv flick/dist/flick-kit-*.zip dist/kit/
      - uses: actions/upload-artifact@v4
        with:
          name: kit
          path: dist/kit/*.zip
          if-no-files-found: error

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the sketch compilers (flick setup)
        uses: actions/cache@v4
        with:
          path: ~/.flick/tools
          key: sketch-toolchains-esp-14.2.0_20260121-${{ runner.os }}
      - run: pip install -r requirements.txt
      - run: python flick.py setup -t thing_plus_esp32 -t thing_plus_esp32c6
      - name: Every example for every board
        run: python flick/tools/ci/build_examples.py --out dist/examples
      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: dist/examples
          if-no-files-found: error

  publish:
    needs: [baseline, kit, examples]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches BASELINE_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c 'import re; print(re.search(r"BASELINE_VERSION \"([^\"]+)\"", open("flick/baseline/src/bl_main.h").read()).group(1))')
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match BASELINE_VERSION $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist        # dist/<target>/baseline-<target>.bin/.bsu, dist/kit/*.zip, dist/examples/
      - name: Download page
        run: python flick/tools/make_site.py --out site_build --dist dist --kit "$(ls dist/kit/*.zip | head -1)"
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            dist/*/baseline-*.bin
            dist/*/baseline-*.bsu
            dist/kit/*.zip
      - name: The download page as an artifact (to look at while the repo is private)
        uses: actions/upload-artifact@v4
        with:
          name: download-page
          path: site_build
      - uses: actions/configure-pages@v5
        if: ${{ !github.event.repository.private }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: site_build

  deploy:
    needs: publish
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
