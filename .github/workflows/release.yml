# Release: push a tag vX.Y.Z (matching BASELINE_VERSION in flick/baseline/src/bl_main.h).
#   1. Baseline for every target (baseline.yml)
#   2. the sketch kit (flick package)
#   3. every example for every board, for the page's example runner (flick/tools/ci/build_examples.py --out;
#      cached, and built per chip in parallel when something changed)
#   4. a GitHub release with the images, the .bsu updates and the kit
#   5. the download page with "Flash" buttons and the example runner on GitHub Pages (flick/tools/make_site.py)
# Run it by hand (workflow_dispatch) to rebuild the page without a release.
# Pages: Settings > Pages > Source: "GitHub Actions". While the repository is
# private the page is only built (artifact "download-page"), not deployed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  baseline:
    uses: ./.github/workflows/baseline.yml

  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python flick.py package
          mkdir -p dist/kit && mv flick/dist/flick-kit-*.zip dist/kit/
      - uses: actions/upload-artifact@v7
        with:
          name: kit
          path: dist/kit/*.zip
          if-no-files-found: error

  # Example images for the page's runner. Cached by the files they're built
  # from; when those changed, each chip's boards build in parallel and the
  # parts are joined (build_examples.py --merge).
  examples-plan:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.cached.outputs.cache-hit }}
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=examples-v1-${{ hashFiles('examples/**', 'flick/sdk/**', 'flick/chips/*/sdk/**', 'flick/chips/*/chip.json', 'flick/targets/*/sdk/**', 'flick/targets/*/target.json', 'flick/tools/flick.py', 'flick/tools/ci/build_examples.py') }}" >> "$GITHUB_OUTPUT"
      - id: cached
        uses: actions/cache/restore@v6
        with:
          path: dist/examples
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - id: groups
        run: echo "groups=$(python3 flick/tools/ci/build_examples.py --groups)" >> "$GITHUB_OUTPUT"

  examples-build:
    needs: examples-plan
    if: needs.examples-plan.outputs.hit != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.examples-plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache the sketch compilers (flick setup)
        uses: actions/cache@v6
        with:
          path: ~/.flick/tools
          key: sketch-toolchains-esp-14.2.0_20260121-${{ runner.os }}
      - run: pip install -r requirements.txt
      - run: python flick.py setup -t thing_plus_esp32 -t thing_plus_esp32c6
        if: matrix.group.chip != 'imxrt1062' && matrix.group.chip != 'rp2040' && matrix.group.chip != 'rp2350' && matrix.group.chip != 'apollo3'
      - name: Cache arduino-pico
        if: matrix.group.chip == 'rp2040' || matrix.group.chip == 'rp2350'
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino-pico-6.3.2-${{ runner.os }}
      - uses: arduino/setup-arduino-cli@v2
        if: matrix.group.chip == 'rp2040' || matrix.group.chip == 'rp2350'
      - name: arduino-pico 6.3.2 (its compiler builds the RP sketches)
        if: matrix.group.chip == 'rp2040' || matrix.group.chip == 'rp2350'
        run: |
          url=https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index --additional-urls "$url"
          arduino-cli core install rp2040:rp2040@6.3.2 --additional-urls "$url"
      - name: Cache Teensyduino
        if: matrix.group.chip == 'imxrt1062'
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: teensyduino-1.62.0-${{ runner.os }}
      - uses: arduino/setup-arduino-cli@v2
        if: matrix.group.chip == 'imxrt1062'
      - name: Teensyduino 1.62.0 (chips/imxrt1062/chip.json teensy_core)
        if: matrix.group.chip == 'imxrt1062'
        run: |
          url=https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli core update-index --additional-urls "$url"
          arduino-cli core install teensy:avr@1.62.0 --additional-urls "$url"
      - name: Cache the Apollo3 core
        if: matrix.group.chip == 'apollo3'
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: sparkfun-apollo3-2.2.1-${{ runner.os }}
      - uses: arduino/setup-arduino-cli@v2
        if: matrix.group.chip == 'apollo3'
      - name: SparkFun Apollo3 core 2.2.1 (its compiler builds the Artemis sketches)
        if: matrix.group.chip == 'apollo3'
        run: |
          url=https://raw.githubusercontent.com/sparkfun/Arduino_Apollo3/main/package_sparkfun_apollo3_index.json
          arduino-cli core update-index --additional-urls "$url"
          arduino-cli core install SparkFun:apollo3@2.2.1 --additional-urls "$url"
      - name: Every example for the ${{ matrix.group.chip }} boards
        run: python flick/tools/ci/build_examples.py --out dist/part ${{ matrix.group.targets }}
      - uses: actions/upload-artifact@v7
        with:
          name: examples-part-${{ matrix.group.chip }}
          path: dist/part
          if-no-files-found: error

  examples:
    needs: [examples-plan, examples-build]
    if: always() && needs.examples-plan.result == 'success' && (needs.examples-build.result == 'success' || needs.examples-build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The examples, from the cache
        if: needs.examples-plan.outputs.hit == 'true'
        uses: actions/cache/restore@v6
        with:
          path: dist/examples
          key: ${{ needs.examples-plan.outputs.key }}
          fail-on-cache-miss: true
      - name: The parts, from the build runners
        if: needs.examples-plan.outputs.hit != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: examples-part-*
          path: parts
      - name: Join the parts
        if: needs.examples-plan.outputs.hit != 'true'
        run: python3 flick/tools/ci/build_examples.py --merge dist/examples parts/*
      - name: Keep them for the next run
        if: needs.examples-plan.outputs.hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist/examples
          key: ${{ needs.examples-plan.outputs.key }}
      - uses: actions/upload-artifact@v7
        with:
          name: examples
          path: dist/examples
          if-no-files-found: error

  publish:
    needs: [baseline, kit, examples]
    # Explicit results: a cache hit skips build jobs further up, and the default
    # condition would skip this job too.
    if: always() && needs.baseline.result == 'success' && needs.kit.result == 'success' && needs.examples.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag matches BASELINE_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c 'import re; print(re.search(r"BASELINE_VERSION \"([^\"]+)\"", open("flick/baseline/src/bl_main.h").read()).group(1))')
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match BASELINE_VERSION $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: baselines
          path: dist        # dist/<target>/baseline-<target>.bin/.bsu
      - uses: actions/download-artifact@v8
        with:
          name: kit
          path: dist/kit
      - uses: actions/download-artifact@v8
        with:
          name: examples
          path: dist/examples
      # A run on main (by hand, to deploy the page) can't read the tag run's
      # caches, so it built its own Baselines; ESP builds aren't byte-identical
      # between runs, and the page's build IDs would then differ from the
      # boards' that pulled the release. Use the release's files instead when
      # a release for this BASELINE_VERSION exists (Teensy .hex isn't a release
      # asset; its build ID is a hash of the sources, so the built one matches).
      - name: The release's Baselines, when this version is released
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import re; print(re.search(r"BASELINE_VERSION \"([^\"]+)\"", open("flick/baseline/src/bl_main.h").read()).group(1))')
          if ! gh release view "v$version" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "no release v$version yet: using the Baselines built here"
            exit 0
          fi
          mkdir -p rel
          gh release download "v$version" --repo "${{ github.repository }}" --dir rel --pattern 'baseline-*'
          n=0
          for f in rel/baseline-*; do
            name=$(basename "$f"); target=${name#baseline-}; target=${target%.*}
            if [ -d "dist/$target" ]; then cp "$f" "dist/$target/$name"; n=$((n + 1)); fi
          done
          echo "took $n Baseline files from release v$version"
      - name: Download page
        run: python flick/tools/make_site.py --out site_build --dist dist --kit "$(ls dist/kit/*.zip | head -1)"
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            dist/*/baseline-*.bin
            dist/*/baseline-*.bsu
            dist/*/baseline-*.uf2
            dist/kit/*.zip
      - name: The download page as an artifact (to look at while the repo is private)
        uses: actions/upload-artifact@v7
        with:
          name: download-page
          path: site_build
      - uses: actions/configure-pages@v6
        if: ${{ !github.event.repository.private }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !github.event.repository.private }}
        with:
          path: site_build

  deploy:
    needs: publish
    if: always() && needs.publish.result == 'success' && !github.event.repository.private
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
