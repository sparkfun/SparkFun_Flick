# Release: push a tag vX.Y.Z (matching BASELINE_VERSION in baseline/src/bl_main.h).
#   1. Baseline for every target (baseline.yml)
#   2. the sketch kit (bsk package)
#   3. a GitHub release with the images, the .bsu updates and the kit
#   4. the download page with "Flash" buttons on GitHub Pages (tools/make_site.py)
# Run it by hand (workflow_dispatch) to rebuild the page without a release.
# Pages: Settings > Pages > Source: "GitHub Actions" (the repository must be
# public, or private Pages must be available on the plan).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  baseline:
    uses: ./.github/workflows/baseline.yml

  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python tools/bsk.py package
          mkdir -p dist/kit && mv dist/baseline-sketcher-kit-*.zip dist/kit/
      - uses: actions/upload-artifact@v4
        with:
          name: kit
          path: dist/kit/*.zip
          if-no-files-found: error

  publish:
    needs: [baseline, kit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches BASELINE_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c 'import re; print(re.search(r"BASELINE_VERSION \"([^\"]+)\"", open("baseline/src/bl_main.h").read()).group(1))')
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match BASELINE_VERSION $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist        # dist/<target>/baseline-<target>.bin/.bsu and dist/kit/*.zip
      - name: Download page
        run: python tools/make_site.py --out site_build --dist dist --kit "$(ls dist/kit/*.zip | head -1)"
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            dist/*/baseline-*.bin
            dist/*/baseline-*.bsu
            dist/kit/*.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_build

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
